<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Intake Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --paper:#0D0D0D;
  --panel:#161616;
  --ink:#F2EFE8;
  --ink-soft:#938F84;
  --line:#3A362E;
  --accent:#E7B23A;
  --good:#5FBF77;
  --over:#E8604A;
  --hair:#2A2823;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  padding:28px 16px 80px;
  min-height:100vh;
}

.wrap{max-width:520px;margin:0 auto;position:relative;}

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%) translateY(20px);
  background:var(--accent);
  color:#141210;
  font-family:'Space Mono',monospace;
  font-size:12px;
  font-weight:700;
  padding:10px 18px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
  z-index:50;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.confirm-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  align-items:center;
  justify-content:center;
  z-index:200;
  padding:20px;
}
.confirm-overlay.show{
  display:flex;
}
.confirm-box{
  background:var(--panel);
  border:2px solid var(--accent);
  padding:20px;
  max-width:340px;
  width:100%;
}
.confirm-msg{
  font-size:15px;
  font-weight:600;
  color:var(--ink);
  margin-bottom:18px;
  line-height:1.4;
}
.confirm-actions{
  display:flex;
  gap:10px;
}
.confirm-actions button{
  flex:1;
  padding:11px;
  border:1px solid var(--hair);
  font-family:'Archivo Black',sans-serif;
  font-size:13px;
  cursor:pointer;
}
.confirm-cancel{
  background:none;
  color:var(--ink);
}
.confirm-cancel:hover{border-color:var(--ink);}
.confirm-delete{
  background:var(--over);
  color:#1a0d0a;
  border-color:var(--over);
}
.confirm-delete:hover{background:#F3735E;}

.backup-section{
  border:1px solid var(--line);
  padding:14px;
  margin-top:16px;
}
.backup-desc{
  font-size:12px;
  color:var(--ink-soft);
  margin:6px 0 12px;
  line-height:1.4;
}
.backup-actions{
  display:flex;
  gap:10px;
}
.backup-btn{
  flex:1;
  padding:10px;
  background:none;
  border:1px solid var(--accent);
  color:var(--accent);
  font-family:'Space Mono',monospace;
  font-size:12px;
  cursor:pointer;
}
.backup-btn:hover{background:var(--accent);color:#141210;}

.data-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  align-items:center;
  justify-content:center;
  z-index:110;
  padding:20px;
}
.data-overlay.show{display:flex;}
.data-box{
  background:var(--panel);
  border:1px solid var(--accent);
  padding:18px;
  max-width:420px;
  width:100%;
  max-height:82vh;
  display:flex;
  flex-direction:column;
}
.data-title{
  font-family:'Archivo Black',sans-serif;
  font-size:16px;
  margin-bottom:8px;
}
.data-desc{
  font-size:12px;
  color:var(--ink-soft);
  margin:0 0 10px;
  line-height:1.4;
}

.multi-photo-box{ max-width:440px; }

.weight-unit{
  align-self:center;
  font-family:'Space Mono',monospace;
  font-size:12px;
  color:var(--ink-soft);
}
.weight-box{ max-width:440px; max-height:90vh; overflow-y:auto; }
.weight-chart svg{
  width:100%;
  height:auto;
  display:block;
  border:1px solid var(--hair);
  background:#0D0D0D;
}
.weight-chart polyline{
  fill:none;
  stroke:var(--accent);
  stroke-width:2;
  stroke-linejoin:round;
  stroke-linecap:round;
}
.weight-chart circle{fill:var(--accent);}
.weight-empty{
  border:1px solid var(--hair);
  padding:16px 12px;
  font-size:12px;
  color:var(--ink-soft);
  text-align:center;
  line-height:1.4;
}
.weight-stats{
  font-family:'Space Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  text-align:center;
  line-height:1.6;
  margin:8px 0 10px;
}
.weight-row{
  display:grid;
  grid-template-columns:1fr auto auto auto;
  gap:10px;
  align-items:center;
  padding:8px 2px;
  border-bottom:1px solid var(--hair);
}
.weight-row-date{
  font-family:'Space Mono',monospace;
  font-size:12px;
  color:var(--ink-soft);
}
.weight-row-kg{
  font-family:'Archivo Black',sans-serif;
  font-size:14px;
  color:var(--accent);
}
.weight-row-delta{
  font-family:'Space Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  min-width:46px;
  text-align:right;
}
.weight-row-del{
  background:none;
  border:1px solid var(--hair);
  color:var(--ink-soft);
  width:24px;
  height:24px;
  cursor:pointer;
  font-size:13px;
  line-height:1;
}
.weight-row-del:hover{border-color:var(--over);color:var(--over);}

.weekly-box{ max-width:440px; max-height:90vh; overflow-y:auto; }
.weekly-row{
  display:grid;
  grid-template-columns:70px 1fr auto;
  gap:4px 10px;
  align-items:center;
  width:100%;
  padding:9px 2px;
  background:none;
  border:none;
  border-bottom:1px solid var(--hair);
  text-align:left;
  cursor:pointer;
  color:var(--ink);
  font-family:'Inter',sans-serif;
}
.weekly-row:hover{background:var(--hair);}
.weekly-day{
  font-family:'Space Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  text-transform:uppercase;
  line-height:1.3;
}
.weekly-day.is-today{color:var(--accent);}
.weekly-bar-track{
  height:8px;
  background:var(--panel);
  border:1px solid var(--line);
  overflow:hidden;
}
.weekly-bar-fill{height:100%;background:var(--accent);}
.weekly-bar-fill.over{background:var(--over);}
.weekly-cal{
  font-family:'Archivo Black',sans-serif;
  font-size:14px;
  color:var(--accent);
  min-width:56px;
  text-align:right;
}
.weekly-row.empty .weekly-cal{color:var(--ink-soft);font-family:'Space Mono',monospace;font-size:12px;}
.weekly-macros{
  grid-column:1 / -1;
  font-family:'Space Mono',monospace;
  font-size:10px;
  color:var(--ink-soft);
}
.weekly-summary{
  border:1px solid var(--accent);
  padding:10px 12px;
  margin-top:12px;
  font-family:'Space Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  text-align:center;
  line-height:1.5;
}
.weekly-summary .avg-cal{
  font-family:'Archivo Black',sans-serif;
  font-size:22px;
  color:var(--accent);
  display:block;
  margin:2px 0;
}
.weekly-summary .avg-macros{color:var(--ink);display:block;}

.previous-items-box{ max-width:440px; max-height:86vh; }
#previousItemsList{
  max-height:60vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
  margin-bottom:12px;
}
.previous-item-row-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  border-bottom:1px solid var(--hair);
}
.previous-item-row-wrap:last-child{border-bottom:none;}
.previous-item-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px 2px;
  cursor:pointer;
  background:none;
  border:none;
  flex:1;
  min-width:0;
  text-align:left;
  font-family:'Inter',sans-serif;
}
.previous-item-row:hover{background:var(--hair);}
.previous-item-delete{
  flex-shrink:0;
  background:none;
  border:1px solid var(--hair);
  color:var(--ink-soft);
  width:26px;
  height:26px;
  cursor:pointer;
  font-size:14px;
  line-height:1;
}
.previous-item-delete:hover{border-color:var(--over);color:var(--over);}
.previous-item-info{min-width:0; flex:1;}
.previous-item-name{
  font-size:14px;
  font-weight:600;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.previous-item-meta{
  font-family:'Space Mono',monospace;
  font-size:10.5px;
  color:var(--ink-soft);
  margin-top:2px;
}
.previous-item-count{
  flex-shrink:0;
  font-family:'Space Mono',monospace;
  font-size:10px;
  color:var(--accent);
  border:1px solid var(--accent);
  padding:2px 7px;
  white-space:nowrap;
}
.previous-items-empty{
  padding:20px 2px;
  font-size:13px;
  color:var(--ink-soft);
  font-style:italic;
  text-align:center;
}
#multiPhotoList{
  max-height:280px;
  overflow-y:auto;
  margin-bottom:10px;
}
.multi-photo-item{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid var(--hair);
}
.multi-photo-item:last-child{border-bottom:none;}
.multi-photo-thumb{
  width:48px;
  height:48px;
  object-fit:cover;
  flex-shrink:0;
  border:1px solid var(--hair);
  background:#0D0D0D;
}
.multi-photo-info{
  flex:1;
  min-width:0;
}
.multi-photo-name{
  font-size:13px;
  font-weight:600;
  color:var(--ink);
  margin-bottom:2px;
}
.multi-photo-macro-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:5px;
  margin-bottom:8px;
}
.multi-photo-macro-grid label{
  display:block;
  font-family:'Space Mono',monospace;
  font-size:8px;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:0.3px;
  margin-bottom:2px;
}
.multi-photo-macro-grid input{
  width:100%;
  background:#0D0D0D;
  color:var(--ink);
  border:1px solid var(--hair);
  font-family:'Inter',sans-serif;
  font-size:11px;
  padding:5px 4px;
}
.multi-photo-macro-grid input:focus{outline:none;border-color:var(--accent);}
.multi-photo-grams-row{
  display:flex;
  align-items:center;
  gap:8px;
}
.multi-photo-grams-input{
  width:70px;
  background:#0D0D0D;
  color:var(--ink);
  border:1px solid var(--hair);
  font-family:'Inter',sans-serif;
  font-size:13px;
  padding:6px 8px;
}
.multi-photo-grams-input:focus{outline:none;border-color:var(--accent);}
.multi-photo-subtotal{
  font-family:'Space Mono',monospace;
  font-size:11px;
  color:var(--accent);
}
.multi-photo-remove{
  flex-shrink:0;
  background:none;
  border:1px solid var(--hair);
  color:var(--ink-soft);
  width:24px;
  height:24px;
  cursor:pointer;
  font-size:13px;
}
.multi-photo-total{
  border:1px solid var(--hair);
  padding:10px 12px;
  margin-bottom:12px;
  font-family:'Space Mono',monospace;
  font-size:12px;
  color:var(--ink-soft);
  text-align:center;
}
.multi-photo-total .total-cal{
  font-family:'Archivo Black',sans-serif;
  font-size:16px;
  color:var(--accent);
}
.multi-photo-total .total-macros{
  color:var(--ink);
}
.data-box textarea{
  width:100%;
  flex:1;
  min-height:140px;
  background:#0D0D0D;
  color:var(--ink);
  border:1px solid var(--hair);
  font-family:'Space Mono',monospace;
  font-size:11px;
  padding:8px;
  resize:vertical;
}
.copy-to-day-input{
  width:100%;
  background:#0D0D0D;
  color:var(--ink);
  border:1px solid var(--hair);
  font-family:'Space Mono',monospace;
  font-size:14px;
  padding:10px;
}
.copy-to-day-input:focus{outline:none;border-color:var(--accent);}
.data-actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}
.data-actions button{
  flex:1;
  padding:11px;
  font-family:'Archivo Black',sans-serif;
  font-size:13px;
  cursor:pointer;
  border:1px solid var(--hair);
}
.data-actions .primary{background:var(--accent);color:#141210;border-color:var(--accent);}
.data-actions .primary:hover{background:#F2C463;}
.data-actions .secondary{background:none;color:var(--ink);}
.data-actions .secondary:hover{border-color:var(--ink);}

.beta-tag{
  font-size:9px;
  color:var(--accent);
  border:1px solid var(--accent);
  padding:1px 5px;
  margin-left:4px;
  vertical-align:middle;
}

.api-key-input{
  width:100%;
  background:#0D0D0D;
  color:var(--ink);
  border:1px solid var(--hair);
  font-family:'Space Mono',monospace;
  font-size:13px;
  padding:10px;
}
.api-key-input:focus{outline:none;border-color:var(--accent);}

.photo-loading-box{
  align-items:center;
  text-align:center;
}
.spinner{
  width:36px;
  height:36px;
  border:3px solid var(--hair);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{
  to{transform:rotate(360deg);}
}

.photo-result-name{
  font-family:'Archivo Black',sans-serif;
  font-size:17px;
  color:var(--ink);
  margin-bottom:4px;
}
.photo-result-note{
  font-size:11px;
  color:var(--ink-soft);
  margin-bottom:12px;
  line-height:1.4;
}
.photo-typical-weight{
  font-size:12px;
  color:var(--good);
  margin:-6px 0 12px;
  line-height:1.4;
}
.photo-result-macros{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:8px 8px;
  font-family:'Space Mono',monospace;
  font-size:10px;
  color:var(--ink-soft);
  text-transform:uppercase;
  text-align:center;
  border:1px solid var(--hair);
  padding:10px 4px;
  margin-bottom:14px;
}
.photo-result-macros div{
  min-width:0;
}
.photo-result-macros div span{
  display:block;
  font-family:'Inter',sans-serif;
  color:var(--accent);
  font-size:14px;
  font-weight:700;
  text-transform:none;
  margin-top:2px;
  word-break:break-word;
}
.photo-grams-field label{
  font-family:'Space Mono',monospace;
  font-size:10px;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:0.5px;
  display:block;
  margin-bottom:4px;
}
.photo-grams-field input{
  width:100%;
  background:#0D0D0D;
  color:var(--ink);
  border:1px solid var(--hair);
  font-family:'Inter',sans-serif;
  font-size:15px;
  padding:9px;
}
.photo-grams-field input:focus{outline:none;border-color:var(--accent);}

.photo-refine-field{
  border-top:1px solid var(--hair);
  margin-top:14px;
  padding-top:12px;
}
.photo-refine-field label{
  font-family:'Space Mono',monospace;
  font-size:10px;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:0.5px;
  display:block;
  margin-bottom:6px;
}
.photo-refine-row{
  display:flex;
  gap:8px;
}
.photo-refine-row input{
  flex:1;
  min-width:0;
  background:#0D0D0D;
  color:var(--ink);
  border:1px solid var(--hair);
  font-family:'Inter',sans-serif;
  font-size:13px;
  padding:9px;
}
.photo-refine-row input:focus{outline:none;border-color:var(--accent);}
.photo-refine-actions{
  display:flex;
  gap:8px;
  margin-top:8px;
}
.photo-refine-actions button{
  flex:1;
  background:none;
  border:1px solid var(--accent);
  color:var(--accent);
  font-family:'Space Mono',monospace;
  font-size:11px;
  padding:9px 6px;
  cursor:pointer;
}
.photo-refine-actions button:hover{background:var(--accent);color:#141210;}
.photo-refine-actions button:disabled{
  border-color:var(--hair);
  color:var(--ink-soft);
  cursor:not-allowed;
  background:none;
}
.photo-ask-answer{
  margin-top:10px;
  padding:10px;
  border:1px solid var(--hair);
  background:#0D0D0D;
  font-size:13px;
  color:var(--ink);
  line-height:1.4;
}

.ask-gemini-row{
  display:flex;
  gap:8px;
}
.ask-gemini-row input{
  flex:1;
  min-width:0;
  background:var(--panel);
  color:var(--ink);
  border:1px solid var(--hair);
  font-family:'Inter',sans-serif;
  font-size:13px;
  padding:9px;
}
.ask-gemini-row .backup-btn{
  flex-shrink:0;
  width:auto;
  padding:0 16px;
}

/* ---- Header ---- */
.masthead{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  border-bottom:6px solid var(--accent);
  padding-bottom:10px;
  margin-bottom:18px;
}
.masthead h1{
  font-family:'Archivo Black',sans-serif;
  font-size:20px;
  line-height:1.15;
  letter-spacing:0.3px;
  margin:0;
}
@media (max-width:400px){
  .masthead h1{font-size:17px;}
}
.masthead .sub{
  font-family:'Space Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  letter-spacing:1px;
  text-transform:uppercase;
}

/* ---- Date nav ---- */
.datebar{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-bottom:18px;
  font-family:'Space Mono',monospace;
  font-size:13px;
}
.datebar button{
  background:none;
  border:1px solid var(--line);
  color:var(--ink);
  width:30px;height:30px;
  cursor:pointer;
  font-family:'Space Mono',monospace;
  font-size:14px;
  border-radius:0;
}
.datebar button:hover{background:var(--accent);color:var(--paper);}
.datebar input[type="date"]{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}
.date-display{
  background:none;
  border:1px solid var(--hair);
  padding:6px 10px;
  font-family:'Space Mono',monospace;
  font-size:13px;
  color:var(--ink);
  cursor:pointer;
  min-width:106px;
  text-align:center;
}
.date-display:hover{border-color:var(--accent);}
.datebar .today-btn{
  border:none;
  width:auto;
  padding:0 10px;
  text-decoration:underline;
  text-underline-offset:3px;
}

/* ---- Nutrition Facts style summary panel ---- */
.facts{
  border:2px solid var(--accent);
  padding:0;
  margin-bottom:24px;
  background:var(--panel);
}
.facts-top{
  border-bottom:9px solid var(--accent);
  padding:10px 14px 8px;
  text-align:center;
}
.facts-top .eyebrow{
  font-family:'Space Mono',monospace;
  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.facts-top h2{
  font-family:'Archivo Black',sans-serif;
  font-size:22px;
  margin:2px 0 0;
}
.facts-row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding:8px 14px;
  border-bottom:1px solid var(--line);
}
.facts-row.thick{border-bottom:4px solid var(--accent);}
.facts-row .label{
  font-size:14px;
  font-weight:600;
}
.facts-row .value{
  font-family:'Archivo Black',sans-serif;
  font-size:20px;
  color:var(--accent);
}
.facts-row .value.big{font-size:34px;}
.facts-row.remaining .value{
  color:var(--good);
}
.facts-row.remaining.over .value{
  color:var(--over);
}
.facts-goal-edit{
  display:flex;
  align-items:center;
  gap:6px;
}
.facts-goal-edit input{
  width:64px;
  font-family:'Space Mono',monospace;
  border:none;
  border-bottom:1px solid var(--hair);
  background:transparent;
  color:var(--ink);
  font-size:14px;
  padding:2px 0;
  text-align:right;
}
.facts-goal-edit input:focus{outline:none;border-color:var(--accent);}

.bar-track{
  height:10px;
  margin:0 14px 12px;

  letter-spacing:0.3px;
  margin:0;
}
@media (max-width:400px){
  .masthead h1{font-size:17px;}
}
.masthead .sub{
  font-family:'Space Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  letter-spacing:1px;
  text-transform:uppercase;
}

/* ---- Date nav ---- */
.datebar{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-bottom:18px;
  font-family:'Space Mono',monospace;
  font-size:13px;
}
.datebar button{
  background:none;
  border:1px solid var(--line);
  color:var(--ink);
  width:30px;height:30px;
  cursor:pointer;
  font-family:'Space Mono',monospace;
  font-size:14px;
  border-radius:0;
}
.datebar button:hover{background:var(--accent);color:var(--paper);}
.datebar input[type="date"]{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}
.date-display{
  background:none;
  border:1px solid var(--hair);
  padding:6px 10px;
  font-family:'Space Mono',monospace;
  font-size:13px;
  color:var(--ink);
  cursor:pointer;
  min-width:106px;
  text-align:center;
}
.date-display:hover{border-color:var(--accent);}
.datebar .today-btn{
  border:none;
  width:auto;
  padding:0 10px;
  text-decoration:underline;
  text-underline-offset:3px;
}

/* ---- Nutrition Facts style summary panel ---- */
.facts{
  border:2px solid var(--accent);
  padding:0;
  margin-bottom:24px;
  background:var(--panel);
}
.facts-top{
  border-bottom:9px solid var(--accent);
  padding:10px 14px 8px;
  text-align:center;
}
.facts-top .eyebrow{
  font-family:'Space Mono',monospace;
  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.facts-top h2{
  font-family:'Archivo Black',sans-serif;
  font-size:22px;
  margin:2px 0 0;
}
.facts-row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding:8px 14px;
  border-bottom:1px solid var(--line);
}
.facts-row.thick{border-bottom:4px solid var(--accent);}
.facts-row .label{
  font-size:14px;
  font-weight:600;
}
.facts-row .value{
  font-family:'Archivo Black',sans-serif;
  font-size:20px;
  color:var(--accent);
}
.facts-row .value.big{font-size:34px;}
.facts-row.remaining .value{
  color:var(--good);
}
.facts-row.remaining.over .value{
  color:var(--over);
}
.facts-goal-edit{
  display:flex;
  align-items:center;
  gap:6px;
}
.facts-goal-edit input{
  width:64px;
  font-family:'Space Mono',monospace;
  border:none;
  border-bottom:1px solid var(--hair);
  background:transparent;
  color:var(--ink);
  font-size:14px;
  padding:2px 0;
  text-align:right;
}
.facts-goal-edit input:focus{outline:none;border-color:var(--accent);}

.bar-track{
  height:10px;
  margin:0 14px 12px;
  background:var(--panel);
  border:1px solid var(--line);
  position:relative;
  overflow:hidden;
}
.bar-fill{
  height:100%;
  background:var(--accent);
  transition:width .3s ease, background .3s ease;
}
.bar-fill.over{background:var(--over);}

.macro-row-main{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px 10px;
  padding:10px 14px 8px;
  font-family:'Space Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:0.5px;
  text-align:center;
}
.macro-row-sub{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px 10px;
  padding:0 14px 14px;
  font-family:'Space Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:0.5px;
  text-align:center;
}
.macro-row-sub .span-left{grid-column:1 / 3; grid-row:1;}
.macro-row-sub .span-right{grid-column:2 / 4; grid-row:1;}
.macro-row-main div, .macro-row-sub div{min-width:0;}
.macro-row-main div span, .macro-row-sub div span{
  display:block;
  font-family:'Inter',sans-serif;
  color:var(--accent);
  font-size:15px;
  font-weight:700;
  text-transform:none;
  letter-spacing:0;
  margin-top:2px;
  word-break:break-word;
}

/* ---- Log entries ---- */
.log-head{
  background:var(--accent);
  color:#141210;
  padding:6px 12px;
  font-family:'Space Mono',monospace;
  font-size:12px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin-bottom:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.copy-day-btn{
  background:none;
  border:1px solid #141210;
  color:#141210;
  font-family:'Space Mono',monospace;
  font-size:10px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  padding:4px 8px;
  cursor:pointer;
}
.copy-day-btn:hover{background:#141210;color:var(--accent);}
.entries{
  border-left:1px solid var(--hair);
  border-right:1px solid var(--hair);
  border-bottom:1px solid var(--hair);
  margin-bottom:20px;
}
.entry{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  border-bottom:1px solid var(--hair);
  gap:10px;
}
.entry:last-child{border-bottom:none;}
.entry .name{
  font-weight:600;
  font-size:14px;
}
.grams-badge{
  font-weight:600;
  font-size:14px;
  color:var(--ink);
}
.entry .macros{
  font-family:'Space Mono',monospace;
  font-size:10.5px;
  color:var(--ink-soft);
  margin-top:2px;
}
.entry .right{
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}
.entry .cal{
  font-family:'Archivo Black',sans-serif;
  font-size:15px;
  color:var(--accent);
}
.entry .edit, .entry .copy-next, .entry .del{
  background:none;
  border:1px solid var(--hair);
  color:var(--ink-soft);
  width:24px;height:24px;
  cursor:pointer;
  font-size:13px;
  line-height:1;
}
.entry .edit:hover{border-color:var(--accent);color:var(--accent);}
.entry .copy-next:hover{border-color:var(--good);color:var(--good);}
.entry .del:hover{border-color:var(--over);color:var(--over);}
.empty-row{
  padding:14px 12px;
  font-size:13px;
  color:var(--ink-soft);
  font-style:italic;
}

/* ---- Add form ---- */
.add-form{
  border:1px solid var(--line);
  padding:14px;
  margin-top:26px;
}
.add-form .eyebrow{
  font-family:'Space Mono',monospace;
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--ink-soft);
  display:block;
}
.form-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}
.cancel-edit{
  background:none;
  border:none;
  color:var(--over);
  font-family:'Space Mono',monospace;
  font-size:11px;
  text-decoration:underline;
  text-underline-offset:3px;
  cursor:pointer;
  padding:0;
}
.form-head-actions{
  display:flex;
  align-items:center;
  gap:14px;
}
.previous-items-link{
  background:none;
  border:none;
  color:var(--accent);
  font-family:'Space Mono',monospace;
  font-size:11px;
  text-decoration:underline;
  text-underline-offset:3px;
  cursor:pointer;
  padding:0;
}
.add-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;}
.field full{
  grid-column:1/-1;
}
.field label{
  font-family:'Space Mono',monospace;
  font-size:10px;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.unit-toggle{
  display:flex;
  gap:8px;
  margin-bottom:2px;
}
.unit-btn{
  flex:1;
  padding:9px;
  background:none;
  border:1px solid var(--hair);
  color:var(--ink-soft);
  font-family:'Space Mono',monospace;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  cursor:pointer;
}
.unit-btn.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#141210;
  font-weight:700;
}
.field input, .field select{
  width:100%;
  border:1px solid var(--hair);
  padding:8px;
  font-family:'Inter',sans-serif;
  font-size:14px;
  background:var(--panel);
  color:var(--ink);
}
.field input:focus, .field select:focus{outline:none;border-color:var(--accent);}

.serving-preview{
  border:1px solid var(--hair);
  padding:10px 12px;
  margin-bottom:12px;
  font-family:'Space Mono',monospace;
  font-size:12px;
  color:var(--ink-soft);
  text-align:center;
}
.serving-preview .total-cal{
  font-family:'Archivo Black',sans-serif;
  font-size:16px;
  color:var(--accent);
}
.serving-preview .total-macros{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:8px 8px;
  font-family:'Space Mono',monospace;
  font-size:10px;
  color:var(--ink-soft);
  text-transform:uppercase;
  text-align:center;
  border:1px solid var(--hair);
  padding:10px 4px;
  margin-bottom:14px;
}
.serving-preview .total-macros div{
  min-width:0;
}
.serving-preview .total-macros div span{
  display:block;
  font-family:'Inter',sans-serif;
  color:var(--accent);
  font-size:14px;
  font-weight:700;
  text-transform:none;
  margin-top:2px;
  word-break:break-word;
}
.photo-refine-field{
  border-top:1px solid var(--hair);
  margin-top:14px;
  padding-top:12px;
}
.photo-refine-row{
  display:flex;
  gap:8px;
}
.photo-refine-row input{
  flex:1;
  min-width:0;
  background:#0D0D0D;
  color:var(--ink);
  border:1px solid var(--hair);
  font-family:'Inter',sans-serif;
  font-size:13px;
  padding:9px;
}
.photo-refine-row input:focus{outline:none;border-color:var(--accent);}
.photo-refine-actions{
  display:flex;
  gap:8px;
  margin-top:8px;
}
.photo-refine-actions button{
  flex:1;
  background:none;
  border:1px solid var(--accent);
  color:var(--accent);
  font-family:'Space Mono',monospace;
  font-size:11px;
  padding:9px 6px;
  cursor:pointer;
}
.photo-refine-actions button:hover{background:var(--accent);color:#141210;}
.photo-refine-actions button:disabled{
  border-color:var(--hair);
  color:var(--ink-soft);
  cursor:not-allowed;
  background:none;
}
