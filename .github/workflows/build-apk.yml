name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android project for barcode scanning
        run: |
          python3 - << 'PY'
          import re, sys
          from xml.dom import minidom

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          gradle_path = 'android/app/build.gradle'

          with open(manifest_path) as f:
              manifest = f.read()

          # 1) Camera + flashlight permissions (before <application>)
          perms = ''
          for p in ('android.permission.CAMERA', 'android.permission.FLASHLIGHT'):
              if p not in manifest:
                  perms += '    <uses-permission android:name="%s" />\n' % p
          if perms:
              manifest, n = re.subn(r'([ \t]*)<application', lambda m: perms + m.group(0), manifest, count=1)
              if n != 1:
                  sys.exit('ERROR: could not find <application> in AndroidManifest.xml')

          # 2) Google ML Kit module dependency (inside <application>)
          if 'com.google.mlkit.vision.DEPENDENCIES' not in manifest:
              meta = '<meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />'
              manifest, n = re.subn(r'(<application[^>]*>)', lambda m: m.group(1) + '\n        ' + meta, manifest, count=1)
              if n != 1:
                  sys.exit('ERROR: could not add meta-data to <application>')

          minidom.parseString(manifest)  # fail the build early if the XML is malformed
          with open(manifest_path, 'w') as f:
              f.write(manifest)

          # 3) Data binding, required by the barcode scanner plugin
          with open(gradle_path) as f:
              gradle = f.read()
          if 'dataBinding' not in gradle:
              block = '\n    buildFeatures {\n        dataBinding true\n    }\n    dataBinding {\n        enabled = true\n    }'
              gradle, n = re.subn(r'(\nandroid\s*\{)', lambda m: m.group(1) + block, gradle, count=1)
              if n != 1:
                  sys.exit('ERROR: could not find android { } block in app/build.gradle')
              with open(gradle_path, 'w') as f:
                  f.write(gradle)

          print('Android project configured for barcode scanning')
          PY

      - name: Configure Android project for phone steps (Health Connect)
        run: |
          if [ ! -d node_modules/capacitor-health ]; then
            echo "capacitor-health is not installed - skipping Health Connect setup"
            exit 0
          fi
          python3 - << 'PY'
          import re, sys
          from xml.dom import minidom

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          variables_path = 'android/variables.gradle'

          # 1) Health Connect needs Android 8.0 (API 26) or newer
          with open(variables_path) as f:
              variables = f.read()
          m = re.search(r'minSdkVersion\s*=\s*(\d+)', variables)
          if not m:
              sys.exit('ERROR: could not find minSdkVersion in android/variables.gradle')
          if int(m.group(1)) < 26:
              variables = variables[:m.start(1)] + '26' + variables[m.end(1):]
              with open(variables_path, 'w') as f:
                  f.write(variables)

          with open(manifest_path) as f:
              manifest = f.read()

          # 2) Permission to read steps (before <application>)
          if 'android.permission.health.READ_STEPS' not in manifest:
              perm = '    <uses-permission android:name="android.permission.health.READ_STEPS" />\n'
              manifest, n = re.subn(r'([ \t]*)<application', lambda mm: perm + mm.group(0), manifest, count=1)
              if n != 1:
                  sys.exit('ERROR: could not find <application> in AndroidManifest.xml')

          # 3) Let the app see the Health Connect app (before <application>)
          if 'com.google.android.apps.healthdata' not in manifest:
              queries = '    <queries>\n        <package android:name="com.google.android.apps.healthdata" />\n    </queries>\n'
              manifest, n = re.subn(r'([ \t]*)<application', lambda mm: queries + mm.group(0), manifest, count=1)
              if n != 1:
                  sys.exit('ERROR: could not add <queries> to AndroidManifest.xml')

          # 4) Permission-rationale screens Health Connect requires (inside <application>).
          #    The activity must come before the alias that targets it.
          if 'PermissionsRationaleActivity' not in manifest:
              block = (
                  '        <activity android:name="com.fit_up.health.capacitor.PermissionsRationaleActivity" android:exported="true">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" />\n'
                  '            </intent-filter>\n'
                  '        </activity>\n'
                  '        <activity-alias android:name="ViewPermissionUsageActivity" android:exported="true"'
                  ' android:targetActivity="com.fit_up.health.capacitor.PermissionsRationaleActivity"'
                  ' android:permission="android.permission.START_VIEW_PERMISSION_USAGE">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.VIEW_PERMISSION_USAGE" />\n'
                  '                <category android:name="android.intent.category.HEALTH_PERMISSIONS" />\n'
                  '            </intent-filter>\n'
                  '        </activity-alias>\n'
              )
              manifest, n = re.subn(r'([ \t]*)</application>', lambda mm: block + mm.group(0), manifest, count=1)
              if n != 1:
                  sys.exit('ERROR: could not find </application> in AndroidManifest.xml')

          minidom.parseString(manifest)  # fail the build early if the XML is malformed
          with open(manifest_path, 'w') as f:
              f.write(manifest)
          print('Android project configured for Health Connect steps')
          PY

      - name: Generate app icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Verify Health plugin and Android permission
        run: |
          test -d node_modules/capacitor-health
          grep -R -E '"name"[[:space:]]*:[[:space:]]*"(Health|HealthPlugin)"' android/app/src/main/assets/capacitor.plugins.json
          grep -q 'android.permission.health.READ_STEPS' android/app/src/main/AndroidManifest.xml

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-intake-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
