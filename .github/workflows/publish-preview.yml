name: Publish step diagnostic companion

on:
  push:
    branches: [codex/health-connect-preview]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Test automatic step sync
        run: npm test

      - name: Prepare separate diagnostic companion
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('capacitor.config.json')
          config = json.loads(p.read_text())
          config['appId'] = 'com.dailyintake.calculator.stepcheck'
          config['appName'] = 'Daily Intake Step Check'
          p.write_text(json.dumps(config, indent=2))
          p = Path('www/index.html')
          page = p.read_text().replace('</head>', '<script>window.STEP_CHECK_COMPANION = true;</script></head>')
          page = page.replace('<title>Daily Intake Calculator</title>', '<title>Daily Intake Step Check</title>')
          p.write_text(page)
          PY

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android project for barcode scanning
        run: |
          python3 - << 'PY'
          import re, sys
          from xml.dom import minidom

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          gradle_path = 'android/app/build.gradle'

          with open(manifest_path) as f:
              manifest = f.read()

          # 1) Camera + flashlight permissions (before <application>)
          perms = ''
          for p in ('android.permission.CAMERA', 'android.permission.FLASHLIGHT'):
              if p not in manifest:
                  perms += '    <uses-permission android:name="%s" />\n' % p
          if perms:
              manifest, n = re.subn(r'([ \t]*)<application', lambda m: perms + m.group(0), manifest, count=1)
              if n != 1:
                  sys.exit('ERROR: could not find <application> in AndroidManifest.xml')

          # 2) Google ML Kit module dependency (inside <application>)
          if 'com.google.mlkit.vision.DEPENDENCIES' not in manifest:
              meta = '<meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />'
              manifest, n = re.subn(r'(<application[^>]*>)', lambda m: m.group(1) + '\n        ' + meta, manifest, count=1)
              if n != 1:
                  sys.exit('ERROR: could not add meta-data to <application>')

          minidom.parseString(manifest)  # fail the build early if the XML is malformed
          with open(manifest_path, 'w') as f:
              f.write(manifest)

          # 3) Data binding, required by the barcode scanner plugin
          with open(gradle_path) as f:
              gradle = f.read()
          if 'dataBinding' not in gradle:
              block = '\n    buildFeatures {\n        dataBinding true\n    }\n    dataBinding {\n        enabled = true\n    }'
              gradle, n = re.subn(r'(\nandroid\s*\{)', lambda m: m.group(1) + block, gradle, count=1)
              if n != 1:
                  sys.exit('ERROR: could not find android { } block in app/build.gradle')
              with open(gradle_path, 'w') as f:
                  f.write(gradle)

          print('Android project configured for barcode scanning')
          PY

      - name: Configure Android project for phone steps (Health Connect)
        run: python3 scripts/configure-health.py

      - name: Generate app icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Retain diagnostic preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: daily-intake-stepcheck-debug-signing-v1

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-intake-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-intake-step-check.apk
          sha256sum daily-intake-step-check.apk > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Separate diagnostic companion for investigating Samsung Health/watch step totals. Installs alongside Daily Intake Calculator; do not uninstall the calculator or clear its data.

          Open Daily Intake Step Check, tap Check step data, and allow step read access. Tap Copy step report and paste it into the support conversation. Choose the day with the mismatch before running the check if needed.

          Compares direct and daily-bucket totals for Samsung Health and all Health Connect sources, then scans paginated step records for source app packages and watch/phone metadata. Raw sums are diagnostic only and are not used as calorie totals. A source scan failure is reported as incomplete, never as missing Samsung data.

          Data stays on-device until you choose to copy/share the report. No food logs, body stats, account identifiers, or individual step records are included. This debug-signed APK has been built and tested automatically; real device results are still needed to establish the cause.
          NOTES
          if gh release view step-check-preview-2026-11-04 >/dev/null 2>&1; then
            gh release upload step-check-preview-2026-11-04 daily-intake-step-check.apk SHA256SUMS --clobber
          else
            gh release create step-check-preview-2026-11-04 daily-intake-step-check.apk SHA256SUMS --target "$GITHUB_SHA" --title 'Daily Intake Step Check — diagnostic app' --notes-file release-notes.md --prerelease --latest=false
          fi
