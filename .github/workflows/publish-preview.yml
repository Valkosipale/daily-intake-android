name: Publish monthly review preview

on:
  push:
    branches: [codex/health-connect-preview]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Test automatic step sync
        run: npm test

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android project for barcode scanning
        run: |
          python3 - << 'PY'
          import re, sys
          from xml.dom import minidom

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          gradle_path = 'android/app/build.gradle'

          with open(manifest_path) as f:
              manifest = f.read()

          # 1) Camera + flashlight permissions (before <application>)
          perms = ''
          for p in ('android.permission.CAMERA', 'android.permission.FLASHLIGHT'):
              if p not in manifest:
                  perms += '    <uses-permission android:name="%s" />\n' % p
          if perms:
              manifest, n = re.subn(r'([ \t]*)<application', lambda m: perms + m.group(0), manifest, count=1)
              if n != 1:
                  sys.exit('ERROR: could not find <application> in AndroidManifest.xml')

          # 2) Google ML Kit module dependency (inside <application>)
          if 'com.google.mlkit.vision.DEPENDENCIES' not in manifest:
              meta = '<meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />'
              manifest, n = re.subn(r'(<application[^>]*>)', lambda m: m.group(1) + '\n        ' + meta, manifest, count=1)
              if n != 1:
                  sys.exit('ERROR: could not add meta-data to <application>')

          minidom.parseString(manifest)  # fail the build early if the XML is malformed
          with open(manifest_path, 'w') as f:
              f.write(manifest)

          # 3) Data binding, required by the barcode scanner plugin
          with open(gradle_path) as f:
              gradle = f.read()
          if 'dataBinding' not in gradle:
              block = '\n    buildFeatures {\n        dataBinding true\n    }\n    dataBinding {\n        enabled = true\n    }'
              gradle, n = re.subn(r'(\nandroid\s*\{)', lambda m: m.group(1) + block, gradle, count=1)
              if n != 1:
                  sys.exit('ERROR: could not find android { } block in app/build.gradle')
              with open(gradle_path, 'w') as f:
                  f.write(gradle)

          print('Android project configured for barcode scanning')
          PY

      - name: Configure Android project for phone steps (Health Connect)
        run: python3 scripts/configure-health.py

      - name: Generate app icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Retain preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: daily-intake-calculator-debug-signing-v1

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-intake-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-intake-monthly-review-debug.apk
          sha256sum daily-intake-monthly-review-debug.apk > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Monthly review now shows each day's calories eaten, estimated TDEE, and recorded step count. TDEE uses that date's latest weigh-in, recorded steps, and gym activity. Days without food logs still show TDEE and steps. Missing step data is distinguished from a recorded zero.

          Automatic steps continue to use Health Connect's combined total and configured source priority. There is no Samsung source selector or diagnostic companion in this calculator build. For Samsung Health, enable its health-data processing consent and give it higher priority in Health Connect.

          Export a backup before updating from an earlier preview. Earlier runners used different debug signing keys, so Android may require uninstalling the old preview first; import your backup after installing. This workflow retains its signing key for future preview builds.

          Android build, step-sync tests, and phone-sized browser checks passed. Historical step counts are the daily readings already synced or entered manually; missing dates are labelled Steps not recorded.
          NOTES
          if gh release view monthly-review-preview-2026-11-04 >/dev/null 2>&1; then
            gh release upload monthly-review-preview-2026-11-04 daily-intake-monthly-review-debug.apk SHA256SUMS --clobber
          else
            gh release create monthly-review-preview-2026-11-04 daily-intake-monthly-review-debug.apk SHA256SUMS --target "$GITHUB_SHA" --title 'Monthly review — daily TDEE and steps' --notes-file release-notes.md --prerelease --latest=false
          fi
