name: Exclude removed months from calibration

on:
  push:
    branches: [codex/health-connect-preview]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Test automatic step sync
        run: npm test

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android project for barcode scanning
        run: |
          python3 - << 'PY'
          import re, sys
          from xml.dom import minidom

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          gradle_path = 'android/app/build.gradle'

          with open(manifest_path) as f:
              manifest = f.read()

          # 1) Camera + flashlight permissions (before <application>)
          perms = ''
          for p in ('android.permission.CAMERA', 'android.permission.FLASHLIGHT'):
              if p not in manifest:
                  perms += '    <uses-permission android:name="%s" />\n' % p
          if perms:
              manifest, n = re.subn(r'([ \t]*)<application', lambda m: perms + m.group(0), manifest, count=1)
              if n != 1:
                  sys.exit('ERROR: could not find <application> in AndroidManifest.xml')

          # 2) Google ML Kit module dependency (inside <application>)
          if 'com.google.mlkit.vision.DEPENDENCIES' not in manifest:
              meta = '<meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />'
              manifest, n = re.subn(r'(<application[^>]*>)', lambda m: m.group(1) + '\n        ' + meta, manifest, count=1)
              if n != 1:
                  sys.exit('ERROR: could not add meta-data to <application>')

          minidom.parseString(manifest)  # fail the build early if the XML is malformed
          with open(manifest_path, 'w') as f:
              f.write(manifest)

          # 3) Data binding, required by the barcode scanner plugin
          with open(gradle_path) as f:
              gradle = f.read()
          if 'dataBinding' not in gradle:
              block = '\n    buildFeatures {\n        dataBinding true\n    }\n    dataBinding {\n        enabled = true\n    }'
              gradle, n = re.subn(r'(\nandroid\s*\{)', lambda m: m.group(1) + block, gradle, count=1)
              if n != 1:
                  sys.exit('ERROR: could not find android { } block in app/build.gradle')
              with open(gradle_path, 'w') as f:
                  f.write(gradle)

          print('Android project configured for barcode scanning')
          PY

      - name: Configure Android project for phone steps (Health Connect)
        run: python3 scripts/configure-health.py

      - name: Generate app icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Retain preview signing key
        uses: actions/cache@v4
        with:
          path: .preview-signing/debug.keystore
          key: daily-intake-calculator-debug-signing-v2

      - name: Configure explicit preview signing key
        run: |
          mkdir -p .preview-signing
          if [ ! -s .preview-signing/debug.keystore ]; then
            keytool -genkeypair -keystore .preview-signing/debug.keystore -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US' -noprompt
          fi
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  debug {
                      storeFile rootProject.file('../.preview-signing/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-intake-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-intake-excluded-months-debug.apk
          sha256sum daily-intake-excluded-months-debug.apk > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Months removed from the yearly view now also stay out of adaptive TDEE calibration. Their calorie/activity dates and weigh-ins are excluded, and excluded gaps cannot be bridged by dropping them from the intake average.

          Changing the removed-month selection clears the learned correction and stability history so excluded months cannot retain indirect influence. The once-per-day guard and saved historical estimates remain intact. Original food, fasting, steps, workouts and weights are preserved. Restoring months makes their data eligible again under normal quality rules.

          All 90 automated tests passed, including removal, learned-offset reset, restored eligibility, source-selection checks on backup import, preservation and the daily guard. Browser checks passed for yearly remove/cancel/restore, totals, records, persistence, backups and mobile layout. Retains live monthly totals, visible steps, personalized TDEE and the update signing key.
          NOTES
          if gh release view excluded-months-preview-2026-11-27 >/dev/null 2>&1; then
            gh release upload excluded-months-preview-2026-11-27 daily-intake-excluded-months-debug.apk SHA256SUMS --clobber
          else
            gh release create excluded-months-preview-2026-11-27 daily-intake-excluded-months-debug.apk SHA256SUMS --target "$GITHUB_SHA" --title 'Exclude removed months from adaptive TDEE' --notes-file release-notes.md --prerelease --latest=false
          fi
